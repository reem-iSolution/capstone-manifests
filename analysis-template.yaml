apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: error-rate-check
  namespace: reem-capstone

spec:
  metrics:
    - name: error-rate
      interval: 30s
      count: 3
      successCondition: len(result) > 0 && result[0] < 0
      failureLimit: 1

      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          query: |
            (
              sum(rate(flask_http_request_total{status=~"5.."}[2m]))
              /
              sum(rate(flask_http_request_total[2m]))
            ) or vector(0)